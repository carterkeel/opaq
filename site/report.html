<style>
:root {
  --ink: #0F172A; --indigo: #6366F1; --slate: #475569;
  --bg: #FFFFFF; --fg: var(--ink); --muted: var(--slate); --line: #E2E6EC; --field: #FFFFFF; --ok: #0B8A3E; --no: #B42318;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0F172A; --fg: #F1F5F9; --muted: #94A3B8; --line: #26324A; --field: #16203A; --ok: #5BD68A; --no: #FF8A80; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { background: #0F172A; color: #FFFFFF; border-bottom: 1px solid #26324A; padding-top: env(safe-area-inset-top, 0px); }
header .wrap { max-width: 1120px; height: 72px; display: flex; align-items: center; justify-content: space-between; }
header a { color: inherit; line-height: 0; }
header svg { height: 22px; width: auto; }
header .back { font-size: 15px; font-weight: 600; color: #A7B1C2; text-decoration: none; line-height: 1; }
header .back:hover { color: #FFFFFF; }
main { padding-block: 72px 96px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(34px, 6vw, 48px); line-height: 1.08; letter-spacing: -0.018em; margin: 0 0 16px; }
.lead { color: var(--muted); margin: 0 0 40px; }
form { display: grid; gap: 22px; }
label { display: grid; gap: 8px; font-weight: 600; font-size: 15px; }
label small { font-weight: 400; color: var(--muted); }
input, textarea { font: inherit; font-weight: 400; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; }
textarea { min-height: 160px; resize: vertical; }
input:focus, textarea:focus { outline: 2px solid var(--indigo); outline-offset: 1px; border-color: transparent; }
.hp { position: absolute; left: -9999px; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
button { justify-self: start; height: 48px; padding: 0 24px; border: 0; border-radius: 10px; background: var(--indigo); color: #FFFFFF; font: 600 16px/1 var(--font-body); cursor: pointer; }
button:hover { background: #5458E6; }
button:disabled { opacity: .6; cursor: default; }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
.status { margin: 0; font-weight: 600; }
.status.ok { color: var(--ok); } .status.no { color: var(--no); }
.status a { color: inherit; }
</style>
</head>

<main class="wrap">
  <h1>Report a problem</h1>
  <p class="lead">Something not working, or not working the way you expected? Tell us what happened and we'll look into it.</p>
  <form id="report">
    <input type="hidden" name="access_key" value="55e1c92b-b0b9-4e6c-8dc5-4a0e5afecc2d">
    <input type="hidden" name="subject" value="Opaq problem report">
    <input type="hidden" name="from_name" value="Opaq website">
    <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label for="message">What happened
      <textarea id="message" name="message" required placeholder="What you did, what you expected, and what happened instead."></textarea>
    </label>
    <label for="device">Phone and app version <small>Optional, for example "Pixel 8, Android 15, build 412"</small>
      <input id="device" name="device" type="text" autocomplete="off">
    </label>
    <label for="email">Your email <small>Optional, only if you'd like a reply</small>
      <input id="email" name="email" type="email" autocomplete="email">
    </label>
    <p class="note">Your report is emailed to the developer through Web3Forms. Please don't include your device code, a backup, or anything about the people in your circles.</p>
    <button type="submit" id="send">Send report</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
(function () {
  var form = document.getElementById("report"), btn = document.getElementById("send"), status = document.getElementById("status");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var data = Object.fromEntries(new FormData(form));
    if (data.botcheck) return;
    delete data.botcheck;
    btn.disabled = true; btn.textContent = "Sending…"; status.className = "status"; status.textContent = "";
    fetch("https://api.web3forms.com/submit", { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(data) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.success) throw new Error(j.message || "Not sent"); }); })
      .then(function () {
        form.reset(); status.className = "status ok"; status.textContent = "Sent. Thanks for letting us know.";
      })
      .catch(function () {
        status.className = "status no";
        status.innerHTML = 'Your report wasn\'t sent. Check your connection and try again, or <a href="https://github.com/carterkeel/opaq/issues">open an issue on GitHub</a>.';
      })
      .then(function () { btn.disabled = false; btn.textContent = "Send report"; });
  });
})();
</script>
