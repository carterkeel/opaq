<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<meta name="referrer" content="no-referrer">
<title>Quietmap</title>
<style>
  :root { --bg: #fff; --text: #1b1b1f; --muted: #5e5e66; --accent: #2c6bed; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --text: #ececf0; --muted: #a2a2ab; --accent: #4a82ff; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  main { max-width: 420px; padding: 32px 24px; }
  h1 { font-size: 26px; margin: 0 0 8px; font-weight: 600; }
  p { color: var(--muted); margin: 0 0 16px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Quietmap</h1>
  <p>Location sharing for family and friends, end-to-end encrypted, with no accounts and no server of its own.</p>
  <p>If someone sent you an invite, open the full link they sent. <a href="https://github.com/carterkeel/quietmap">Source code</a></p>
</main>
</body>
</html>
