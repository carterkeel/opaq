name: Play bundle

# Builds the signed release bundle (.aab) for Google Play. Run it by hand from the Actions tab
# (Play bundle → Run workflow) on main. It needs the upload key in four repository secrets:
#   OPAQ_UPLOAD_KEYSTORE_B64    the .jks file, base64-encoded
#   OPAQ_UPLOAD_STORE_PASSWORD  its store password
#   OPAQ_UPLOAD_KEY_ALIAS       the key's alias
#   OPAQ_UPLOAD_KEY_PASSWORD    the key's password
# The key only ever exists in the runner's temp folder for this run. The bundle and the R8 mapping
# file (upload it to Play too, so crash reports are readable) are the run's artifacts.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown in the store"
        required: true
        default: "0.1.0"
      version_code:
        description: "Version code (blank: this run's number + 100). Must be higher than any bundle uploaded before."
        required: false
        default: ""

permissions:
  contents: read

# Explicit bash turns on pipefail, so a failing Gradle command isn't hidden by a pipe.
defaults:
  run:
    shell: bash

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      # AGP needs the NDK's tools to strip the native libraries and extract their debug symbols
      # for Play; the version is the one pinned in androidApp/build.gradle.kts.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' androidApp/build.gradle.kts)
          [ -n "$ndk" ] || { echo "::error::No ndkVersion in androidApp/build.gradle.kts"; exit 1; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - name: Unit tests (crypto and protocol)
        run: ./gradlew :shared:testAndroidHostTest --warning-mode all --stacktrace

      - name: Write the upload key
        env:
          KEY_B64: ${{ secrets.OPAQ_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.OPAQ_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPAQ_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPAQ_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The upload key isn't set up: add the four OPAQ_UPLOAD_* secrets (see the top of play-bundle.yml)."
            exit 1
          fi
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "OPAQ_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the release bundle
        env:
          OPAQ_UPLOAD_STORE_PASSWORD: ${{ secrets.OPAQ_UPLOAD_STORE_PASSWORD }}
          OPAQ_UPLOAD_KEY_ALIAS: ${{ secrets.OPAQ_UPLOAD_KEY_ALIAS }}
          OPAQ_UPLOAD_KEY_PASSWORD: ${{ secrets.OPAQ_UPLOAD_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          export OPAQ_VERSION_NAME="$VERSION_NAME"
          export OPAQ_VERSION_CODE="${VERSION_CODE:-$((GITHUB_RUN_NUMBER + 100))}"
          echo "Building $OPAQ_VERSION_NAME ($OPAQ_VERSION_CODE)"
          ./gradlew :androidApp:bundleRelease --warning-mode all --stacktrace 2>&1 | tee "$RUNNER_TEMP/bundle.log"
          # Without the NDK's tools AGP only warns, and Play then says the bundle has no debug symbols.
          if grep -q "Unable to strip" "$RUNNER_TEMP/bundle.log"; then
            echo "::error::AGP couldn't strip the native libraries, so the bundle has no native debug symbols."
            exit 1
          fi

      # Fails unless the bundle is signed; prints only the certificate's SHA-256 fingerprint, to
      # match with the upload certificate in Play Console. Not its owner fields: this repo's
      # Actions logs are public.
      - name: Check the bundle is signed
        run: |
          aab=$(ls androidApp/build/outputs/bundle/release/*.aab)
          jarsigner -verify "$aab" | tail -n 3
          jarsigner -verify "$aab" | grep -q "jar verified"
          keytool -printcert -jarfile "$aab" | grep -E "SHA256:" | head -1

      # Play reads native debug symbols from this folder in the bundle; without it, it warns.
      - name: Check the bundle has native debug symbols
        run: |
          aab=$(ls androidApp/build/outputs/bundle/release/*.aab)
          unzip -l "$aab" | grep "BUNDLE-METADATA/com.android.tools.build.debugsymbols/" | awk '{print $1, $4}'
          unzip -l "$aab" | grep -q "BUNDLE-METADATA/com.android.tools.build.debugsymbols/.*\.so\.sym" \
            || { echo "::error::The bundle has no native debug symbols."; exit 1; }

      - name: Upload the bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: opaq-play-bundle
          path: |
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
