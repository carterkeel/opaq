name: Store screenshots

# Google Play screenshots, made by hand: Actions → Store screenshots → Run workflow.
# Runs androidTest/StoreScreenshots.kt on an emulator with made-up people (ci/store-screenshots.sh)
# and saves the PNGs as an artifact and on a store-screenshots-<set> branch (force-pushed, latest
# run only). Sets: phone (1080 x 1920) or foldable (1:1, 4:3, 3:4 unfolded; 10:16 outer screen).
on:
  workflow_dispatch:
    inputs:
      set:
        description: Which screenshots
        type: choice
        options: [phone, foldable, video]
        default: phone

# Write access is only for pushing the screenshots to the store-screenshots-<set> branch.
permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SCREENSHOT_SET: ${{ inputs.set || 'phone' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take the screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: ./ci/store-screenshots.sh

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opaq-store-screenshots-${{ env.SCREENSHOT_SET }}
          path: store-screens/*
          if-no-files-found: warn

      # Also on a branch, so they can be fetched with git. Made-up data only.
      - name: Push the screenshots to the store-screenshots-<set> branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(mktemp -d)
          mkdir -p "$out/screens"
          cp store-screens/* "$out/screens/" 2>/dev/null || true
          { echo "Run ${GITHUB_RUN_ID} on ${GITHUB_REF_NAME} (${GITHUB_SHA})"
            grep -nE "FATAL EXCEPTION|AndroidRuntime|OpaqStore|Exception" store-logcat.txt 2>/dev/null | head -80 || true
          } > "$out/log.txt"
          cd "$out"
          git init -q -b "store-screenshots-$SCREENSHOT_SET"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Store screenshots from run ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "store-screenshots-$SCREENSHOT_SET"
