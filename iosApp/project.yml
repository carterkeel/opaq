# Generates iosApp.xcodeproj. The generated project is committed, so building only needs Xcode;
# after changing this file run `xcodegen` here (brew install xcodegen) and commit both.
name: iosApp
options:
  bundleIdPrefix: me.opaq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Opaq:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # Control Center intents, shared with OpaqControls; OPAQ_APP marks the half that runs here.
      - path: Shared
    dependencies:
      - target: OpaqControls
    entitlements:
      path: iosApp/Opaq.entitlements
      properties:
        # Lets the Control Center extension read whether sharing is on (OpaqSharedState).
        com.apple.security.application-groups: [group.me.opaq.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.opaq.app # as listed on the App Store and Google Play
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OPAQ_APP"
        PRODUCT_NAME: Opaq
        # Assets.xcassets/AppIcon: one 1024px PNG, drawn from the Android launcher icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Builds the alternate icons too, so Settings → Appearance → App icon can switch to them.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosApp/Info.plist
        # The Gradle build phase writes outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework OpaqUI -lc++"
        # The Kotlin code is built for Apple-silicon simulators only (iosSimulatorArm64).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # Signing for a real phone: set your own team in Xcode (free accounts work for your own devices).
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          # Builds :ui's OpaqUI framework for the current SDK and architecture.
          # Xcode doesn't inherit your shell, so find JDK 17 if JAVA_HOME isn't set.
          if [ -z "$JAVA_HOME" ]; then
            JAVA_HOME="$(/usr/libexec/java_home -v 17 2>/dev/null)"
            [ -z "$JAVA_HOME" ] && [ -d /opt/homebrew/opt/openjdk@17 ] && JAVA_HOME=/opt/homebrew/opt/openjdk@17
            export JAVA_HOME
          fi
          cd "$SRCROOT/.."
          ./gradlew :ui:embedAndSignAppleFrameworkForXcode

  # Control Center controls (iOS 18+): "Share My Location" toggle and "Update My Location".
  # Draws the controls only; their actions run in the app (Shared/OpaqControlIntents.swift).
  OpaqControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: OpaqControls
      - path: Shared
    entitlements:
      path: OpaqControls/OpaqControls.entitlements
      properties:
        com.apple.security.application-groups: [group.me.opaq.app]
    info:
      path: OpaqControls/Info.plist
      properties:
        CFBundleDisplayName: Opaq
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.opaq.app.controls
        PRODUCT_NAME: OpaqControls
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
